services:

  mysql:
    image: mysql:5.6
    container_name: mysql
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "3306:3306"

    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

  glassfish:
    build:
      context: ./app

    container_name: glassfish

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - mysql

    ports:
      - "8080:8080"
      - "8181:8181"
      - "4848:4848"